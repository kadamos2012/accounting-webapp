{% extends "base.html" %}
{% block title %}تغيير كلمة السر{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 30px auto;">
    <h2>🔑 تغيير كلمة السر</h2>
    <form method="post">
        <label>كلمة السر الحالية:</label>
        <input type="password" name="current_password" required style="width:100%;">
        <label>كلمة السر الجديدة:</label>
        <input type="password" name="new_password" required style="width:100%;">
        <label>تأكيد كلمة السر الجديدة:</label>
        <input type="password" name="confirm_password" required style="width:100%;">
        <br><br>
        <button type="submit" class="btn btn-green">تغيير</button>
    </form>
</div>
{% if message %}
<div class="card" style="background:#E8F5E9; max-width:420px; margin:0 auto;">{{ message }}</div>
{% endif %}
{% endblock %}
