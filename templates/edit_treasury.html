{% extends "base.html" %}
{% block title %}تعديل حركة خزنة{% endblock %}
{% block content %}
<div class="card">
    <h2>✏ تعديل حركة خزنة</h2>
    <form method="post">
        <label>نوع الحركة:</label>
        <select name="movement_type" style="width:100%;">
            {% for t in movement_types %}
            <option value="{{ t }}" {{ 'selected' if t == txn.movement_type }}>{{ t }}</option>
            {% endfor %}
        </select>

        <label>الحساب:</label>
        <select name="account_type" style="width:100%;">
            <option value="نقدي" {{ 'selected' if (txn.account_type or 'نقدي') == 'نقدي' }}>💵 نقدي</option>
            <option value="بنك" {{ 'selected' if txn.account_type == 'بنك' }}>🏦 بنك</option>
        </select>

        <label>اسم الطرف:</label>
        <input type="text" name="party" value="{{ txn.party_name or '' }}" style="width:100%;">

        <label>البيان:</label>
        <input type="text" name="description" value="{{ txn.description or '' }}" style="width:100%;">

        <label>التاريخ:</label>
        <input type="date" name="date" value="{{ txn.transaction_date }}">

        <label>المبلغ:</label>
        <input type="number" step="0.01" name="amount" value="{{ txn.incoming or txn.outgoing }}" style="width:100%; font-size:18px;">

        <br><br>
        <button type="submit" class="btn btn-green">حفظ التعديلات</button>
    </form>
</div>

<div class="card">
    <form method="post" action="{{ url_for('delete_treasury_page', txn_id=txn.id) }}"
          onsubmit="return confirm('{{ gform('متأكد', 'متأكدة') }} إنك {{ gform('عايز', 'عايزة') }} تحذف الحركة دي نهائيًا؟');">
        <button type="submit" class="btn" style="background:#c62828;">🗑 حذف هذه الحركة</button>
    </form>
</div>
{% endblock %}
