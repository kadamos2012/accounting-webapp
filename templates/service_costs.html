{% extends "base.html" %}
{% block title %}تعديل تكلفة الخدمات{% endblock %}
{% block content %}
<div class="card">
    <h2>📦 إضافة تكلفة خدمة جديدة</h2>
    <form method="post">
        <input type="hidden" name="action" value="add">
        <label>الباكدج:</label>
        <select name="new_package" style="width:100%;">
            {% for p in packages %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
        </select>
        <label>المكوّن:</label>
        <select name="new_component" style="width:100%;">
            <option>تأشيرة</option><option>استثمار</option><option>موافقة</option>
        </select>
        <label>الفئة:</label>
        <select name="new_category" style="width:100%;">
            <option>بالغ</option><option>انثى</option><option>طفل</option><option>رضيع</option><option>الكل</option>
        </select>
        <label>التكلفة:</label>
        <input type="number" step="0.01" name="new_cost" required>
        <br><br>
        <button type="submit" class="btn btn-green">إضافة</button>
    </form>
</div>

<div class="card">
    <h2>تعديل التكاليف الحالية</h2>
    <form method="post">
        <table>
            <tr><th>الباكدج</th><th>المكوّن</th><th>الفئة</th><th>سارٍ من</th><th>سارٍ إلى</th><th>التكلفة</th></tr>
            {% for r in rows %}
            <tr>
                <td>{{ r.package_code }}</td>
                <td>{{ r.component }}</td>
                <td>{{ r.category }}</td>
                <td><input type="date" name="from_{{ r.id }}" value="{{ r.date_from }}" style="width:135px;"></td>
                <td><input type="date" name="to_{{ r.id }}" value="{{ r.date_to }}" style="width:135px;"></td>
                <td><input type="number" step="0.01" name="cost_{{ r.id }}" value="{{ r.cost }}" style="width:110px;"></td>
            </tr>
            {% endfor %}
        </table>
        <br>
        <button type="submit" class="btn btn-green">حفظ كل التعديلات</button>
    </form>
</div>
{% endblock %}
