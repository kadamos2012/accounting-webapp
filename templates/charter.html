{% extends "base.html" %}
{% block title %}حجز شارتر{% endblock %}
{% block content %}
<div class="card">
    <h2>🛩 إضافة حجز رحلة شارتر</h2>
    <form method="post">
        <label>رقم الرحلة (بنفس الصيغة الموجودة فى حجوزات العملاء):</label>
        <input type="text" name="flight_number" style="width:100%;" required>

        <label>تاريخ المغادرة:</label>
        <input type="date" name="departure_date" required>

        <label>شركة الطيران:</label>
        <input list="airlineList" name="airline" style="width:100%;" required>
        <datalist id="airlineList">{% for a in airlines %}<option value="{{ a }}">{% endfor %}</datalist>

        <label>التكلفة الإجمالية للشارتر:</label>
        <input type="number" step="0.01" name="total_cost" required>

        <label><input type="checkbox" name="recalculate" checked> إعادة حساب تكلفة العملاء الموجودين بالفعل على هذه الرحلة</label>

        <br><br>
        <button type="submit" class="btn btn-green">حفظ</button>
    </form>
</div>
{% if result %}
<div class="card" style="background: {{ '#E8F5E9' if result.success else '#FFEBEE' }};">
    {{ result.message }}
</div>
{% endif %}
{% endblock %}
